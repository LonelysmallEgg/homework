<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系遊戲官網 - INDEX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <a href="/index.html" class="site-logo" onclick="switchPage('index')">
            <div class="site-logo-icon">G</div>
            <span>PROJECT</span>
        </a>

        <nav class="nav-menu">
            <a href="/index.html" class="nav-link" id="nav-index" onclick="switchPage('index')">首頁</a>
            <a href="/games.html" class="nav-link" id="nav-games" onclick="switchPage('games')">遊戲</a>
            <a href="/news.html" class="nav-link" id="nav-news" onclick="switchPage('news')">最新消息</a>
            <a href="/help.html" class="nav-link" id="nav-help" onclick="switchPage('help')">幫助</a>
        </nav>

        <div class="header-right">
            <form class="search-box" action="search.html" method="GET">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" class="search-input" placeholder="搜尋位置...">
            </form>
            <button class="user-account-btn" onclick="window.location.href='login.html'">
                <span>👤</span> 帳號登入
            </button>
        </div>
    </header>

    <main class="page-container active">
        <div class="contact-inner">
            <h1 class="page-title">Establish Connection // 聯繫我們</h1>
            <form class="contact-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label class="form-label">Codename / 您的暱稱</label>
                    <input type="text" class="form-input" placeholder="Enter your name..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Signal Address / 電子信箱</label>
                    <input type="email" class="form-input" placeholder="username@domain.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Transmission Content / 訊息內容</label>
                    <textarea class="form-textarea" placeholder="Type your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" onclick="alert(`暫未開放接受信件 謝謝`)">Send Signal // 傳送封包</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="/jobchance.html" onclick="switchPage('jobchance')">工作機會</a>
            <a href="/story.html" onclick="switchPage('story')">媒體報導</a>
            <a href="/connect.html" onclick="switchPage('connect')">聯繫我們</a>
            <a href="/help.html" onclick="switchPage('help')">客服支援</a>
            <a href="/about.html" onclick="switchPage('about')">關於我們</a>
        </div>
        <p>© 2026 AETHERIA GAME STUDIO. ALL RIGHTS RESERVED. 本網站為個人二次元遊戲作品展示網頁範例。</p>
    </footer>
</body>

</html>
