<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號登入 - 日系遊戲官網</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="site-logo">
            <div class="site-logo-icon">G</div>
            <span>PROJECT</span>
        </a>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link" id="nav-index">首頁</a>
            <a href="games.html" class="nav-link" id="nav-games">遊戲</a>
            <a href="news.html" class="nav-link" id="nav-news">最新消息</a>
            <a href="help.html" class="nav-link" id="nav-help">幫助</a>
        </nav>

        <div class="header-right">
            <form class="search-box" action="search.html" method="GET">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" class="search-input" placeholder="搜尋位置...">
            </form>
            <button class="user-account-btn" onclick="window.location.href='login.html'">
                <span>👤</span> 帳號登入
            </button>
        </div>
    </header>

    <main class="page-container active">
        <div class="login-frame">
            <h2 class="login-title">帳號登入</h2>
            
            <form action="" >
                <div class="field-block">
                    <label class="field-label">帳號 / 電子郵件 (Username/Email)</label>
                    <input type="text" class="input-control" required placeholder="請輸入帳號或電子郵件">
                </div>
                
                <div class="field-block">
                    <label class="field-label">密碼 (Password)</label>
                    <input type="password" class="input-control" required placeholder="請輸入密碼">
                </div>
                
                <div class="action-row">
                    <button class="action-btn submit" onclick="alert(`登入未開放 謝謝`)">登入</button>
                    <button type="button" class="action-btn cancel" onclick="window.location.href='index.html'">取消</button>
                </div>
            </form>
            
            <div class="link-block">
                <a href="" class="forget-link" onclick="alert(`密碼找回未開放 謝謝`)">忘記密碼？</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="/jobchance.html" onclick="switchPage('jobchance')">工作機會</a>
            <a href="/story.html" onclick="switchPage('story')">媒體報導</a>
            <a href="/connect.html" onclick="switchPage('connect')">聯繫我們</a>
            <a href="/help.html" onclick="switchPage('help')">客服支援</a>
            <a href="/about.html" onclick="switchPage('about')">關於我們</a>
        </div>
        <p>© 2026 AETHERIA GAME STUDIO. ALL RIGHTS RESERVED. 本網站為個人二次元遊戲作品展示網頁範例。</p>
    </footer>

</body>
</html>
